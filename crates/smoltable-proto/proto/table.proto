syntax = "proto3";

package table;

service SmoltableTable {
  rpc MutateRows(MutateRowsRequest) return (MutateRowsResponse);
  rpc ReadRow(ReadRowRequest) returns (ReadRowResponse);
  // TO DO:
  // rpc ReadRows(ReadRowsRequest) returns (stream ReadRowsResponse);
}

message MutateRowsRequest {
  repeated RowMutation row_mutations = 1
}

message RowMutation {
  bytes row_key = 1;
  repeated Mutation mutations = 2;
}

message Mutation {
  repeated Family families = 1;
}

message SetCell {
  bytes family_name = 1;
  bytes column_qualifier = 2;
  int64 timestamp_micros = 3;
  bytes value = 4;
}

message DeleteFromColumn {
  bytes family_name = 1;
  bytes column_qualifier = 2;
  int64 timestamp_micros = 3;
}

message MutateRowResponse {}

message ReadRowRequest { bytes row_key = 1; }

message ReadRowResponse {
  bytes row_key = 1;
  repeated Family families = 2;
}

message Family {
  bytes name = 1;
  repeated Column columns = 2;
}

message Column {
  bytes qualifier = 1;
  repeated Cell cells = 2;
}

message Cell {
  int64 timestamp_micros = 1;
  oneof operation {
    bytes value = 2;
    bool is_deleted = 3;
  }
}
